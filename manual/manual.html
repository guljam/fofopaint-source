<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FofoPaint Manual</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1c2230; --muted:#667085; --line:#e4e7ec;
  --accent:#5b5bf0; --accent-soft:#eeeefe; --code-bg:#f2f4f7; --th:#f9fafb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.04);
  --side-w:290px; --top-h:56px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --panel:#171a23; --text:#e8eaf0; --muted:#98a2b3; --line:#2a2f3c;
    --accent:#8b8bff; --accent-soft:#23254a; --code-bg:#232735; --th:#1c202b;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117; --panel:#171a23; --text:#e8eaf0; --muted:#98a2b3; --line:#2a2f3c;
  --accent:#8b8bff; --accent-soft:#23254a; --code-bg:#232735; --th:#1c202b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:15.5px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}

/* top bar */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top-h);z-index:30;display:flex;align-items:center;gap:12px;
  padding:0 20px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.seg{display:flex;background:var(--code-bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:5px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:34px;height:34px;border-radius:10px;
  cursor:pointer;font-size:16px;display:inline-grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
#menuBtn{display:none}

/* sidebar */
.sidebar{position:fixed;top:var(--top-h);bottom:0;left:0;width:var(--side-w);overflow-y:auto;padding:20px 14px 40px;
  background:var(--panel);border-right:1px solid var(--line);z-index:20}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:block;padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;line-height:1.45;
  border-left:2px solid transparent;transition:.12s}
.toc a:hover{background:var(--code-bg);color:var(--text)}
.toc a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc .l1{margin-top:10px}
.toc .l1 > a{font-weight:600;color:var(--text)}
.toc .l1 > a.active{color:var(--accent)}
.toc .l2 a{margin-left:14px;font-size:13.5px}

/* content */
main{margin-left:var(--side-w);padding:calc(var(--top-h) + 32px) 32px 80px}
article{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:44px 52px}
article h1{font-size:26px;letter-spacing:-.02em;margin:2.2em 0 .6em;padding-bottom:.4em;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--top-h) + 16px)}
article h1:first-child{margin-top:0}
article h2{font-size:19px;margin:1.9em 0 .6em;scroll-margin-top:calc(var(--top-h) + 16px)}
article h2::before{content:"";display:inline-block;width:4px;height:1em;background:var(--accent);border-radius:2px;margin-right:10px;vertical-align:-2px}
article h3{font-size:16px;margin:1.5em 0 .5em}
article p{margin:.8em 0}
article a{color:var(--accent)}
article figure{margin:1.4em 0;text-align:center}
article img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#fff}
article figcaption{display:none}
article code{font:13px/1.4 ui-monospace,"Cascadia Code",Consolas,monospace;background:var(--code-bg);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:1px 6px;white-space:nowrap}
article ul,article ol{padding-left:1.4em}
article li{margin:.3em 0}
article blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
article strong{font-weight:700}
.table-wrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:12px}
article table{border-collapse:collapse;width:100%;font-size:14px}
article th{background:var(--th);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
article th,article td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
article tr:last-child td{border-bottom:0}
article tbody tr:hover{background:var(--th)}
article table img{max-height:48px;border:0;background:transparent;vertical-align:middle}
.foot{max-width:860px;margin:18px auto 0;text-align:center;color:var(--muted);font-size:12.5px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,18,.82);display:none;place-items:center;z-index:100;cursor:zoom-out;padding:24px}
.lb.on{display:grid}
.lb img{max-width:96vw;max-height:94vh;border-radius:10px;background:#fff}
.scrim{display:none}

@media (max-width:900px){
  #menuBtn{display:inline-grid}
  .sidebar{transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow);width:min(86vw,320px)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:var(--top-h) 0 0 0;background:rgba(0,0,0,.4);z-index:15}
  main{margin-left:0;padding:calc(var(--top-h) + 16px) 16px 60px}
  article{padding:24px 18px;border-radius:12px}
  .brand span{display:none}
}
</style>
</head>

  <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>

<h1 id="필수세팅">필수세팅</h1>
<p>와콤 드라이버 설정 창을 열고 맵핑 탭의 <strong>Windows 잉크 사용
체크를 해제</strong>해 주세요, 사용 시 선이 이상하게 그어집니다.</p>
<p>타블렛 사용시 펜 버튼에 마우스 오른쪽 키를 설정해 주세요. 툴 선택과
일부 기능은 마우스 오른쪽 버튼을 사용해야 편리합니다.</p>
<h1 id="툴-선택-방법">툴 선택 방법</h1>
<figure>
<img src="./images/193027299-7c0a4c8b-76fc-4843-b01a-cf323483f8cc.png"
alt="newtool2" />
<figcaption aria-hidden="true">newtool2</figcaption>
</figure>
<p>캔버스에 커서를 두고 마우스 오른쪽 클릭을 누르면 툴 메뉴가
나타납니다.</p>
<p>선택하고 싶은 툴 아이콘에 커서를 이동한 후 마우스 오른쪽 버튼을 떼면
선택됩니다.</p>
<p>캔버스 이동은 밝은 부분을 아무데나 클릭 후 드래그 하면 됩니다.
(마우스 왼쪽+오른쪽 클릭 상태가 됨)</p>
<p>줌 툴, 회전 툴, 이미지 이동 툴은 캔버스 이동이 되지 않으며 툴 고유
기능을 사용합니다. (드래그를 이용)</p>
<p>채우기펜(fill-pen) 사용법은 툴을 선택후 캔버스에 원하는 영역을
그립니다. 클릭을 하면 다각형을 그릴 수 있습니다. 오른쪽 클릭을 하면
아이콘 3개가 나타나는데, undo버튼을 누르게 되면 그린 영역을 이전으로
돌릴 수 있습니다. OK버튼에 커서를 올려놓고 클릭을 떼면 채우기가
완료됩니다.</p>
<p>라소툴 사용법은 <a href="#라소툴-사용법">여기</a>를 클릭</p>
<p>빠른 사이드 바(Quick side bar)는 측면에 있는 사이드 바를 현재 마우스
커서로 이동 시킵니다. 마우스 오른쪽 클릭을 하거나 사이드바 바깥 쪽을
클릭하면 원래 위치로 되돌아갑니다.</p>
<p>괄호 안의 알파벳은 (오른손잡이 단축키, 왼손잡이 단축키) 입니다.</p>
<h1 id="단축키">단축키</h1>
<figure>
<img src="./images/724ea577-bdac-49ad-b8c6-0e72999be1f3.png"
alt="keylayout3" />
<figcaption aria-hidden="true">keylayout3</figcaption>
</figure>
<p>녹색 영역은 오른손잡이, 파란색 영역은 왼손잡이용 입니다. 기본적으로
키를 누르면 있으면 기능이 활성화되고, 떼면 꺼집니다. 버튼에 커서를 두면
힌트가 나타납니다. 해당 힌트 단축키 설명을 참고하세요.</p>

<h1 id="펜-옵션">펜 옵션</h1>
<p><img
src="./images/172030469-9247dc93-544c-40dd-969b-83e155b53aae.png"
alt="penoption1" /> 펜 모양과 크기, 손 떨림 보정 강도를 조절합니다.</p>
<p><img
src="./images/233364028-86793b20-593e-4902-a764-cc1fe170a49a.jpg"
alt="layerfunc" /> - 레이어 선택 상자입니다. 가장 왼쪽의 화살표는 레이어
1번과 2번의 이미지를 서로 바꾸는 기능입니다.</p>
<ul>
<li><p>글씨를 클릭하면 레이어가 선택됩니다. 중복으로 클릭하면 해당
레이어만 보기/해제가 가능합니다.</p></li>
<li><p>체크표시된 사각형 박스는 박스가 체크되면 이미지 이동 툴(move
image)과 라소 툴(lasso)만 활성화 됩니다. 이 두개의 툴은 레이어 1번과 2번
전부 이미지를 수정합니다. 하지만 체크 표시가 켜져 있을경우 해당 레이어만
수정이 가능합니다.</p></li>
<li><p>오른쪽에 있는 화살표를 클릭하면 1번 레이어의 이미지가 2번
레이어에 합쳐집니다.</p></li>
</ul>

alt="penoption3" /> 선의 느낌이 날카로워 집니다.</p>
<p><img
src="./images/172030486-0e6b2f5f-f2f8-4138-8566-b1ae9fbf72e4.png"
alt="penoption4" /> 선의 윤곽이 흐려집니다.</p>

<h1 id="색-선택기">색 선택기</h1>
<figure>
<img src="./images/f8c55682-4011-4e40-8b3c-ca64b17534f8.png" alt="color1" />
<figcaption aria-hidden="true">color1</figcaption>
</figure>
<ul>
<li>Paper 아이콘을 클릭한 후 색을 선택하면 배경색이 바뀝니다.</li>
<li>Pen 아이콘을 클릭한 후 색을 선택하면 펜 색깔이 바뀝니다.</li>
<li>Pen 아이콘 아랫쪽에 있는 작은 박스를 클릭하면 변경되기 전의 색이
선택됩니다.</li>
<li>체크무늬 아이콘을 선택하면 투명색을 선택할 수 있습니다. 지우개와
기능과 동일하지만, 직선 툴 또는 채우기 펜(fill pen)에서도 지우개와 같이
색을 지울 수 있습니다.</li>
<li>투명색은 다른 색을 선택하면 취소됩니다.</li>
<li>“RGB 0,0,0” 부분을 클릭하면 수동으로 RGB값을 입력할 수
있습니다.</li>
<li>“RGB 0,0,0” 부분에서 ’RGB’단어를 클릭할 때마다 RGB와 HSV로 전환 할
수 있습니다. 값을 전환하는 과정에서 1정도 오차가 날 수 있습니다.</li>
<li>수동으로 RGB값을 변경할 때 화살표 좌우 키 또는 tab키로 r g b항목
이동 할 수 있으며, 화살표 위 아래키로 1씩 값을 증가, 감소 할 수
있습니다. 화살표키 대신 W A S D, I J K L키도 똑같이 사용
가능합니다.</li>
<li>입력 값을 완료 하려면 다른 곳을 클릭하거나, Esc 또는 Enter 또는
Space키를 누르세요.</li>
</ul>
<figure>
<img src="./images/6a4664c6-35a5-45a9-b129-08a988b65dd1.png"
alt="mypalette" />
<figcaption aria-hidden="true">mypalette</figcaption>
</figure>
<ul>
<li>마이팔레트는 색을 90개까지 저장합니다.</li>
<li>“my palette” 버튼을 중복 클릭하면 숨겨진 팔레트 영역이 펼치거나 숨길
수 있습니다.</li>
<li>색을 선택한 후, 마이팔레트 상자에 길게 클릭하면 색을 수동으로 등록할
수 있습니다.</li>
<li>해당 칸을 계속 길게 클릭하면 새로운 색 - 투명색 - 이전색이 반복되며
등록됩니다.</li>
<li>색을 클릭 + 드래그 하여 색 위치를 이동시킬 수 있습니다.</li>
<li>“my palette”버튼을 약 2초간 길게 클릭 하면 팔레트의 색상을 모두 지울
수 있습니다.</li>
</ul>
<figure>
<img src="./images/133b1de9-3615-4084-a1aa-a34e60871ff8.png" alt="numpad" />
<figcaption aria-hidden="true">numpad</figcaption>
</figure>
<ul>
<li>“RGB 0,0,0” 부분을 클릭하면 색을 수동으로 입력하면 숫자패드가
나옵니다.</li>
<li>클립보드에 hex값을 적용하는 버튼과 OKLCH슬라이더가 있습니다.</li>
<li>OKLCH는 인간친화적인 색상 모델입니다 LCH는 밝기(Lightness)
Chroma(채도) Hue(색조)의 약자이며, HSV시스템과 비슷하지만 색상을
변경할때 자연스러운 색상으로 즉시 변경할수 있습니다</li>
<li>해당 앱에 탑재된 OKLCH컬러 슬라이더는 기본적인 수치계산 기능만
제공하며 수치에 따라서 과채도나 색상 왜곡이 발생할 수 있으나 정상적인
동작입니다</li>
</ul>

<h2 id="그리기-모드">그리기 모드</h2>
<p><img
src="./images/172030682-9760978c-5b9d-4900-8059-fb250bb2143c.png"
alt="top1" /> <img
src="./images/172030709-76a58bd2-f5fd-459b-b43a-3a33043fbab2.png"
alt="top1-1" /> 리플레이 모드, 그리기 모드로 변경하는 버튼입니다.</p>
<p><img
src="./images/172030683-7ccb08e5-1db5-49c4-9631-c1c4d21fff26.png"
alt="top2" /> 캡쳐모드로 변경하는 버튼입니다.</p>
<p><img
src="./images/172030684-fa7e8eff-43a8-4644-ba35-24b4e4b5d90e.png"
alt="top3" /> 저장 버튼입니다. 처음 저장할 때만 경로와 이름을 묻고, 그
다음에 클릭할때는 처음 지정한 경로와 이름으로 저장됩니다. - 새로운
경로와 이름으로 저장하고 싶다면, 저장 버튼을 오른쪽 클릭하거나 단축키
<code>Ctrl+Shift+S</code>를 누르세요. - <em>.png 파일과 </em>.2020 파일,
2개를 저장합니다. 2020 확장자의 파일은 원본 이미지와 리플레이 데이터를
담고 있습니다. 이어서 그릴경우 *.2020 파일을 불러오는것을 권장합니다. -
이미지크기와 리플레이 파일이 클 경우 저장시간이 오래 걸릴 수 있습니다.
저장하는 과정에서는 일부 버튼이 비활성화 됩니다.</p>
<p><img
src="./images/172030685-dee55e5d-1d52-42af-a28a-ca8b1d8ed5f8.png"
alt="top4" /> 불러오기 버튼입니다. <em>.2020 파일과, </em>.png,
<em>.gif, </em>.jpg파일을 불러올 수 있습니다. - 파일을 드래그 &amp;
드롭으로 창에 끌어놓아 불러올 수도 있습니다. - 프로그램에서 지원하는
최대 해상도는 2000x2000이며, 이미지가 이 해상도를 넘을 시 강제로
리사이즈 됩니다.</p>
<p><img
src="./images/172030686-8f981783-6048-4de3-bb8d-23c1dd409d51.png"
alt="top5" /> 클립보드에 복사된 이미지가 있으면 이 버튼이 활성화 됩니다.
- 또한, 이미지 파일과 *.2020파일이 클립보드에 복사 되어있어도 활성화
됩니다. - 단축키는 <code>Ctrl+V</code>입니다.</p>
<p><img
src="./images/172030687-d3b7111e-4fc6-4c18-b68c-14180fb7310f.png"
alt="top6" /> 새 파일을 만드는 버튼입니다. 단축키 <code>ESC</code> 또는
<code>Delete</code>를 두 번 눌러도 됩니다. - 새 파일이 만들어지면 기존
이미지와 리플레이 데이터가 완전히 사라지게 되니 사용하기 전에 데이터를
저장하세요.</p>
<p><img
src="./images/172030688-4ea49673-d713-43e0-a183-c44a3e64f53e.png"
alt="top7" /> 격자 표시 버튼입니다. 누를때 마다 격자 간격이 변하거나
꺼집니다.</p>
<p><img
src="./images/172030689-a9b4d7f1-94f3-4d62-9201-f90a6be0b898.png"
alt="top8" /> 툴 메뉴 위치를 좌/우로 변경하는 버튼입니다.</p>
<p><img
src="./images/172030690-fd0b5d3f-943a-4b56-a8af-77a4c6fa2ea4.png"
alt="top9" /> 툴 메뉴를 감추는 버튼입니다. - 커서를 창의 가장자리에
가져가면 툴 메뉴가 보여집니다.</p>
<p><img
src="./images/172030691-465cac10-e671-4484-847e-e35e3300c03e.png"
alt="top10" /> 인터페이스의 색깔을 바꾸는 버튼입니다.</p>
<p><img
src="./images/193263209-f46148ca-29fd-455f-80c6-29ef02db7948.png"
alt="newwindow" /> 새 창을 띄웁니다. - 캔버스 이미지를 확인 할 수 있는
창입니다. - 새 창에 마우스 오른쪽 클릭 하면 창크기가 이미지에 맞춰
조정됩니다. - 새 창이 활성화 된 상태에서 esc키를 누르면 창이 닫힙니다. -

<p><img

볼 수 있고, 앱을 초기화 하는 버튼이 있습니다. - 새 버전이 감지되면
느낌표 표시로 바뀝니다. 업데이트 내용에 따라서 앱이 초기화 되는 경우가
있으니 업데이트 하기전에 작업을 저장하세요. - 업데이트 실패 할 경우
런타임을 최신버전으로 설치 하시기 바랍니다.
https://airsdk.harman.com/runtime</p>
<h2 id="리플레이-모드">리플레이 모드</h2>
<p><img
src="./images/172031161-5004d7bf-8fde-4084-be14-53f83cbeb5ef.png"
alt="rep1" /> 현재 그려지고 있는 이미지를 캡쳐 하는 버튼 입니다.</p>
<p><img
src="./images/172030687-d3b7111e-4fc6-4c18-b68c-14180fb7310f.png"
alt="top6" /> 현재 그려지고 있는 이미지를 처음으로 하여 새 파일을
만듭니다. - 새 파일이 만들어지면 기존 이미지와 리플레이 데이터가 완전히
사라지게 되니 사용하기 전에 데이터를 저장하세요.</p>
<p><img
src="./images/181043728-64851b97-a830-4b4c-9919-1a7f167ff661.png"
alt="rep3-1" /> 데이터 앞/뒤 지우기 버튼입니다. - 프레임 탐색막대에서
원하는 시점으로 이동한 후에 이 버튼을 2초간 누르세요. - 이 버튼을
이용하여 원하는 리플레이 데이터만 남길 수 있습니다. 이 버튼을 사용하면
그리기 모드에서 그리고 있는 그림에도 영향이 있으므로 주의하세요. -
데이터 뒤 지우기는 undo와 같은 기능을 합니다. 사용하면 그리기 모드에서
그리고 있는 그림이 리플레이가 그려지고 있는 시점으로 돌아갑니다. -
지워진 데이터는 복원할 수 없으니 주의해서 사용하세요.</p>
<p><img
src="./images/172031166-a63af1b2-1472-45fe-970d-e3eeb239180c.png"
alt="rep5" /> 캔버스를 확대/축소하는 버튼입니다. 마우스 오른쪽 버튼을
클릭하면 줌이 초기화 됩니다.</p>
<p><img
src="./images/197422680-0d6a2568-fb22-4f8b-a784-24a7b76984f7.png"
alt="repfit" /> 캔버스를 창 중앙에 위치 시킵니다. 클릭 할 때마다
켜지거나 꺼집니다.</p>
<p><img
src="./images/172031167-42eb5419-d4c4-4585-9e67-f2ec0d9128de.png"
alt="rep6" /> 캔버스를 회전하는 버튼입니다. 클릭한 후 좌우로 드래그
하세요.</p>
<p><img
src="./images/172031275-edcaa712-2755-40d6-b1fe-d06594a7ada0.png"
alt="rep7" /> 리플레이를 스트로크 단위로 이동하는 버튼입니다. 이 버튼을
오른쪽 클릭하거나, <code>Shift</code>키를 누른채로 클릭하면 1프레임

<p><img src="./images/71df26b1-f3be-48f7-8d9b-fa2cf6b68f1e.png"
alt="reprepeat" /> 이 버튼이 활성화 되어있으면 리플레이가 종료되었을때

<p><img
src="./images/172031160-b73481cd-691d-4c1a-b74c-52a72e317ea5.png"
alt="rep0" /> 리플레이 재생 속도를 조절 할 수 있는 막대 입니다. -
재생시간이 짧은 경우에는 활성화되지 않습니다.</p>

<h1 id="라소툴-사용법">라소툴 사용법</h1>
<ul>
<li>라소툴 버튼을 선택 후(또는 <code>R</code>, <code>Y</code> 키를
누른채로) 영역을 그리면 메뉴가 나타납니다.</li>
<li>메뉴가 나타난 상태에서 캔버스 부분을 클릭+드래그 하면 영역안의
이미지가 움직입니다.</li>
</ul>
<p><img
src="./images/193026133-b5f0cd8c-99da-4222-b698-afa908afbba1.png"
alt="lassotrace" /> 선택한 영역의 이미지를 참고 레이어로 이동 시킵니다.

<h1 id="참고-레이어-사용법">참고 레이어 사용법</h1>
<ul>
<li>FOFO페인트는 그림을 그릴 수 있는 본 레이어가 하나있고, 참고 레이어는
본 레이어 아랫쪽에 위치합니다.</li>
<li>말 그대로 참고만 할 수 있는 레이어로 깔끔하게 선을 따거나 할때
쓰이는 레이어입니다.</li>
<li>툴 메뉴에서 참고레이어(Reference layer)를 선택하면 창이 뜹니다.</li>
</ul>
<p><img
src="./images/172031885-570f0c39-afdd-4893-a806-31cbfbc3d159.png"
alt="ref1" /> 현재의 이미지를 참고 레이어로 이동시키는 버튼입니다. -
참고 레이어에 이미 이미지가 그려져 있을경우 그 위에 계속 그려집니다. -
Undo버튼을 누르면 사라진 이미지를 복원 할 수 있습니다. - 본 레이어에
밑그림을 그리고 이 버튼을 눌러 이미지를 참고 레이어로 보낸다음, 그
그림을 참고하여 깔끔하게 그림을 그릴 수 있습니다.</p>
<p><img
src="./images/172031887-b4bcd7ca-7d65-40e1-95d1-ad2cb350d339.png"
alt="ref2" /> 참고 레이어에 다른 이미지를 불러오는 버튼입니다. - 참고
레이어에 있는 이미지 지워지고 불러온 이미지가 새롭게 그려집니다. -
트레이싱 연습을 하고자 할때 이미지를 이 버튼을 이용하여 이미지를 불러올
수 있습니다.</p>
<p><img
src="./images/172031888-515b753c-9d8b-4d6a-b03c-16891d27dde9.png"
alt="ref3" /> 클립보드에 복사된 이미지를 참고레이어로 복사 하는
버튼입니다 - 클립보드에 복사된 이미지가 있을경우 이 버튼이 활성화
됩니다.</p>
<p><img
src="./images/172031890-968b6647-e8af-49ad-b6ed-6bb545eeb6ce.png"
alt="ref5" /> 메모리 트레이닝 버튼입니다. - 이 버튼을 눌러 눈이 감겨지게
되면 그림을 그릴 때마다 참고 레이어가 보이지 않게됩니다. 트레이싱 연습을
할 때 형태를 기억하는 연습을 할 수 있습니다.</p>
<p><img
src="./images/172031891-f2ff7470-a28e-4fea-8617-954a71a2e7af.png"
alt="ref6" /> 참고레이어의 이미지를 지우는 버튼입니다.</p>
<p><img
src="./images/172032165-11d5e768-687e-4b4f-8e86-136e0c9e3c9a.png"
alt="ref7" /> 참고레이어의 투명도를 조절하는 막대입니다. - 참고 레이어에
새로운 이미지가 복사되면 투명도가 50%로 재조정 됩니다.</p>
<h1 id="캔버스-크기-조절">캔버스 크기 조절</h1>
<ul>
<li><p><code>Ctrl</code>키를 누르거나 마우스 오른쪽 클릭을 1초정도
누르고 있으면 캔버스 주변에 테두리가 나타납니다.</p></li>
<li><p>그 때 원하는 테두리를 클릭+드래그 하여 캔버스를 원하는 크기로
조절합니다. 대각선 조정은 되지 않으며 가로 또는 세로만 조절
가능합니다.</p></li>
<li><p><code>Ctrl</code>키를 떼거나 마우스 오른쪽 클릭을 떼면 캔버스
크기 조정이 종료됩니다.</p></li>
<li><p>캔버스 크기를 조절할 때 캔버스 경계의 격자 선에 커서를 대면 일정
비율에 맞게 조정이 가능합니다.</p></li>
</ul>

<img src="./images/198891449-27a86ac2-bc51-40e8-acdf-47e1ebe326cc.gif"

<h1 id="앱-창크기-배율-설정">앱 창크기 배율 설정</h1>
<ul>
<li><p>고해상도 모니터에서 창 크기배율을 125% 이상 설정했을때,
포포페인트 UI배율을 1:1로 할지 안할지를 설정합니다.</p></li>
<li><p>fofopaint.exe 파일을 찾습니다. 기본 설치를 했다면 C:Files
(x86)경로에 있습니다.</p></li>
<li><p>fofopaint.exe 오른쪽 클릭, 속성에 들어갑니다. 호환성 탭을
클릭합니다.</p></li>
<li><p>높은 DPI설정 변경을 클릭합니다, 새 창 아래에 DPI재정의 탭이
활성화 되어있으면 FOFO PAINT 앱의 UI가 1:1배율 유지하고 체크가 해제
되어있으면 윈도우 창크기의 배율에 따라 약간 확대되어 보입니다.</p></li>
<li><p>만일 높은 DPI설정 변경이 되지 않는다면 “모든 사용자에 대한
변경”을 클릭하여, 다시 높은 DPI설정 변경을 클릭해 설정합니다.</p></li>
</ul>
<h1 id="수동으로-앱-초기화">수동으로 앱 초기화</h1>
<ul>
<li><p>윈도우 운영체제의 경우 &lt; C: [사용자 이름] Store&gt; 혹은 &lt;
%appdata%Store &gt; 경로로 가시면 파일들이 있습니다 이 파일들을 전부
삭제 후 앱을 시작하면 앱이 초기화됩니다.</p></li>
<li><p>혹은 파일 검색에서 “repdata”라는 이름을 검색한 후, 해당 위치로
이동한뒤 파일들을 전부 지워주세요.</p></li>
</ul>
<h1 id="기본-앱-설정">기본 앱 설정</h1>
<ul>
<li>윈도우 사용자 기준 설명입니다.</li>
<li>파일을 저장하면 *.2020파일이 생성되는데 이 파일을 더블클릭하면 어떤
앱을 연결 할 것인지 선택 할 수 있습니다.</li>
<li>pc에서 앱 선택 버튼을 클릭 후 fofo paint 설치경로(C:Files (x86))로
이동하여 fofopaint.exe를 클릭합니다.</li>
<li>기본 앱이 제대로 선택 되었다면 *.2020확장자 파일의 아이콘이 얼룩꼬리
포포로 변경됩니다.</li>
<li>*.2020파일을 더블클릭하여 실행하면 fofo paint앱이 실행되면서 드래그
&amp; 드롭 메뉴가 나타납니다.</li>
<li>기존에 저장되어있던 그림을 저장하지 않고 로드하려면 “load file”를
클릭, 저장하고 로드하려면 “save and load file”을 선택합니다.</li>
<li>“transfer to reference layer”는 로드 되는 이미지를 참고레이어로
전송하는 버튼입니다.</li>
</ul>
</template>

<h1 id="color-picker">Color picker</h1>

<li>Click the small box at the bottom of the Pen icon to select the

same function as the eraser, but you can also use the Line Tool or
Fill-pen to erase colors like an eraser.</li>

and down arrow keys to increase or decrease the value by 1. W A S D, I J

area can be expanded or hidden.</li>

second to manually register the color.</li>

through the new color - the transparent color - and the previous

stands for Lightness, Chroma, and Hue, and it enables more natural color
transitions compared to the HSV system.</li>

<h1 id="adjust-canvas-size">Adjust canvas size</h1>
<ul>
<li><p>Hold down the <code>Ctrl</code> key or the mouse right click for
a second to see a border around the canvas.</p></li>
<li><p>Then click and drag the desired border to adjust the canvas to
the desired size. No diagonal adjustment, only horizontal or vertical
adjustments are possible.</p></li>
<li><p>Release the <code>Ctrl</code> key or right-click to end the
canvas sizing.</p></li>
<li><p>When adjusting the canvas size, Hold the mouse cursor over the
grid line that appears at the canvas boundary</p></li>
<li><p>When you are resizing the canvas, you can resize the canvas with
a specific ratio by placing the mouse cursor over the grid line that
appears at the canvas boundary.</p></li>
</ul>

<h1 id="set-app-window-size-scaling">Set app window size scaling</h1>
<ul>
<li><p>When the window size scale is set to 125% or higher on a
high-resolution monitor, set whether FOFO Paint UI scale is 1:1 or
not.</p></li>
<li><p>Find the fofopaint.exe. If you did a default installation, it’s
in the path “C:Files (x86)”</p></li>
<li><p>Right-click fofopaint.exe and go to Properties. Click the
Compatibility tab.</p></li>
<li><p>Click Change high DPI setting, if the DPI override tab at the
bottom of the new window is active, the UI of the FOFO PAINT app will
maintain 1:1 scaling and If unchecked, it is slightly enlarged according
to the magnification of the window size.</p></li>
<li><p>If the high DPI setting does not change, click “Change for all
users” and click Change high DPI setting again to set it.</p></li>
</ul>
<h1 id="manually-reset-the-app">Manually reset the app</h1>
<ul>
<li><p>For Windows operating system, go to &lt; C: [username] &gt; or
&lt; %appdata%&gt; path to find the file. After deleting all these files
and launching the app, the app initializes.</p></li>
<li><p>Alternatively, search for the name “repdata” in file search, go
to that location and delete all files.</p></li>
</ul>
<h1 id="default-app-settings">Default app settings</h1>
<ul>
<li>This explanation is based on Windows users.</li>
<li>When you save the file, a *.2020 file is created. When you
double-click this file, you can select which app to connect.</li>
<li>Click the app selection button on your PC, then go to the fofo paint
installation path (C:Files (x86)) and click fofopaint.exe.</li>
<li>If the default app is selected correctly, the icon of the *.2020
extension file will change to a FOFO.</li>
<li>When you double-click the *.2020 file to run it, the fofo paint app
will run and a drag &amp; drop menu will appear.</li>
<li>To load a previously saved picture without saving it, click “load
file”, or to save and load it, select “save and load file”.</li>
<li>“Transfer to reference layer” is a button to transfer the image to
the reference layer.</li>
</ul>

<h1 id="ペンオプション">ペンオプション</h1>
<p><img
src="./images/172030469-9247dc93-544c-40dd-969b-83e155b53aae.png"
alt="penoption1" /> ペン形や大きさ、手ブレ補正強度を調節します。</p>
<p><img
src="./images/233364028-86793b20-593e-4902-a764-cc1fe170a49a.jpg"
alt="layerfunc" /> - レイヤー選択ボックスです。 左の矢印は、レイヤー 1
番と 2 番の画像を互いに変える機能です。</p>
<ul>
<li><p>文字をクリックするとレイヤーが選択されます。
２回以上クリックすると、そのレイヤーを単独で表示・解除ができます。</p></li>
<li><p>チェックマーク付きの四角ボックスは、ボックスがチェックされると画像移動ツール（move
image）とラソツール（lasso）のみ有効になります。
これら2つのツールは、レイヤー1と2のすべての画像を修正します。
ただし、チェックマークが点灯している場合は、そのレイヤーのみを変更できます。</p></li>
<li><p>右にある矢印は、1 番レイヤーのイメージを2
番レイヤーに倂合します。</p></li>
</ul>
<p><img
src="./images/172030482-c152ee3f-711a-4529-a93b-fd19ba2289a4.png"
alt="penoption3" /> 線の感じが鋭くなります。</p>
<p><img
src="./images/172030486-0e6b2f5f-f2f8-4138-8566-b1ae9fbf72e4.png"
alt="penoption4" /> 線の輪郭がぼやけます。</p>
<p><img
src="./images/193265927-55ffbbae-2465-4acf-9cbb-4035b78c4bb5.png"
alt="opabutton2" /> ペンの透明度を調節します。</p>
<h1 id="色選択">色選択</h1>
<figure>
<img src="./images/f8c55682-4011-4e40-8b3c-ca64b17534f8.png" alt="color1" />
<figcaption aria-hidden="true">color1</figcaption>
</figure>
<ul>
<li>Paperアイコンをクリックして色を選択すると、背景色が変わります。</li>
<li>Penアイコンをクリックして色を選択すると、ペンの色が変わります。</li>
<li>Penアイコンの真下にある小さいボックスをクリックすると、変更される前の色が選択されます。</li>
<li>市松模様のアイコンを選択すると、透明色を選択できます。
消しゴムと機能と同じですが、直線ツールやFill-penでも消しゴムのように色を消すことができます。</li>
<li>透明色の選択を取り消すには、別の色を選択するとキャンセルされます。</li>
<li>「RGB 0,0,0」部分をクリックすると、手動でRGB値を入力できます。</li>
<li>「RGB
0,0,0」部分の「RGB」のテキストをクリックしたら値をRGBとHSVに切り替えることができます。
値を切り替える過程で1程度値の誤差が発生することがあります。</li>
<li>手動でRGB値を変更する時、矢印左右キーまたはtabキーでr g
b項目移動でき、矢印上下キーで1ずつ値を増加、減少することができます。
矢印キーの代わりにW A S D、I J K Lキーも同じように使用できます。</li>
<li>入力値を完了するには、別の場所をクリックするか、EscまたはEnterまたはSpaceキーを押します。</li>
</ul>
<figure>
<img src="./images/6a4664c6-35a5-45a9-b129-08a988b65dd1.png"
alt="mypalette" />
<figcaption aria-hidden="true">mypalette</figcaption>
</figure>
<ul>
<li>マイパレットには最大90色が保存されます。</li>
<li>「my
palette」ボタンを複数クリックすることで、非表示パレット領域を見たり隠したりできます。</li>
<li>色を選択後、マイパレットボックスを１秒ほど長くクリックすると、手動で色を登録できます。</li>
<li>同じ位置をずっと長くクリックしていると、新しい色ー透明色ー以前の色を循環して登録することができます。</li>
<li>色をクリック+ドラッグすることで色の位置を移動できます。</li>
<li>「my
palette」ボタンを２秒間長くクリックするとパレットのすべての色を消します。</li>
</ul>
<figure>
<img src="./images/133b1de9-3615-4084-a1aa-a34e60871ff8.png" alt="numpad" />
<figcaption aria-hidden="true">numpad</figcaption>
</figure>
<ul>
<li>“RGB 0,0,0” 部分をクリックすると、テンキーが現れます。</li>
<li>ClipBoardにコピーされたHEX値を適用するボタンとOKLCHスライダーがあります。</li>
<li>OKLCHは人間の知覚に近いカラーモデルで、LCHはLightness（明るさ）、Chroma（彩度）、Hue（色相）の略です。色を変更する際、HSVシステムよりも自然な色変化が可能です。</li>
<li>アプリに搭載されたOKLCHカラースライダーは、基本的な数値計算機能のみを備えており、数値によっては彩度が過剰になったり、色味に歪みが生じることがありますが、これは正常な動作です。</li>
</ul>
<h1 id="上段のメニュー">上段のメニュー</h1>
<h2 id="お絵描きモード">お絵描きモード</h2>
<p><img
src="./images/172030682-9760978c-5b9d-4900-8059-fb250bb2143c.png"
alt="top1" /> <img
src="./images/172030709-76a58bd2-f5fd-459b-b43a-3a33043fbab2.png"
alt="top1-1" /> リプレイモード、描きモードに変更するボタンです。</p>
<p><img
src="./images/172030683-7ccb08e5-1db5-49c4-9631-c1c4d21fff26.png"
alt="top2" /> キャプチャモードに変更するボタンです。</p>
<p><img
src="./images/172030684-fa7e8eff-43a8-4644-ba35-24b4e4b5d90e.png"
alt="top3" />
保存ボタンです。初めて保存するときだけ経路と名前を聞き、その後はクリックだけで最初に決めた経路に自動的に保存します。
新しい経路と名前で保存したい場合は、保存ボタンを右クリックするか、ショートカットキー<code>Ctrl+Shift+S</code>を押してください。
- <em>.pngファイルと</em>.2020ファイル、2つを保存します。
2020拡張子のファイルはRawイメージとリプレイデータを含んでいます。
続いて描く場合*。2020ファイルを読み込むことをお勧めします。 -
画像サイズとリプレイファイルが大きい場合、保存時間が長くかかることがあります。
保存する過程では、一部のボタンが無効化されます。</p>
<p><img
src="./images/172030685-dee55e5d-1d52-42af-a28a-ca8b1d8ed5f8.png"
alt="top4" /> 読み込みボタンです。
<em>.2020ファイルと、</em>.png、<em>.gif、</em>.jpgファイルを読み込むことができます。
-
ファイルをドラッグ&amp;ドロップでウィンドウにドラッグして読み込むこともできます。
-
プログラムで対応する最大解像度は2000x2000で、画像がこの解像度を超える場合は強制的にリサイズされます。</p>
<p><img
src="./images/172030686-8f981783-6048-4de3-bb8d-23c1dd409d51.png"
alt="top5" />
クリップボードにコピーされた画像があれば、このボタンが有効になります。 -
また、イメージファイルと*.2020ファイルがクリップボードにコピーされていても有効になります。
- ショートカットキーは<code>Ctrl+V</code>です。</p>
<p><img
src="./images/172030687-d3b7111e-4fc6-4c18-b68c-14180fb7310f.png"
alt="top6" /> 新しいファイルを作成するボタンです。
ショートカットキー「ESC」または「Delete」を2回押してもいいです。 -
新しいファイルが作成されると、既存のイメージとリプレイデータが完全に消えるので、使用する前にデータを保存してください。</p>
<p><img
src="./images/172030688-4ea49673-d713-43e0-a183-c44a3e64f53e.png"
alt="top7" /> 格子表示ボタンです。
押すたびに格子間隔が変わったり消えたりします。</p>
<p><img
src="./images/172030689-a9b4d7f1-94f3-4d62-9201-f90a6be0b898.png"
alt="top8" /> ツールメニューの位置を左右に変更するボタンです。</p>
<p><img
src="./images/172030690-fd0b5d3f-943a-4b56-a8af-77a4c6fa2ea4.png"
alt="top9" /> ツールメニューを隠すボタンです。 -
カーソルをウィンドウの端に移動すると、ツールメニューが表示されます。</p>
<p><img
src="./images/172030691-465cac10-e671-4484-847e-e35e3300c03e.png"
alt="top10" /> インターフェースの色を変えるボタンです。</p>
<p><img
src="./images/193263209-f46148ca-29fd-455f-80c6-29ef02db7948.png"
alt="newwindow" /> 新しい窓を表示します。 -
キャンバスイメージを確認できるウィンドウです。 -
ウィンドウの中を右クリックするとウィンドウのサイズが画像に合わせて調整されます。
- ウィンドウが活性化された状態でescキーを押すとウィンドウが閉じます。 -
ウィンドウ内部をクリック+ドラッグすると、ウィンドウの位置を移動させることができます。</p>
<p><img
src="./images/172030693-09d0e2f3-2253-4edc-8075-08706e54c4ff.png"
alt="top11" /> アプリの情報を示すボタンです。 -
言語別にマニュアルを見られ、アプリを初期化するボタンがあります。 -
新しいバージョンが検出されると、感嘆符表示に変わります。
アップデート内容によっては、アプリが初期化される場合がありますので、更新する前にデータを保存してください。
-
アップデートに失敗した場合は、ランタイムを最新バージョンにインストールしてください。
https://airsdk.harman.com/runtime</p>
<h2 id="ᅟreplayモード">ᅟReplayモード</h2>
<p><img
src="./images/172031161-5004d7bf-8fde-4084-be14-53f83cbeb5ef.png"
alt="rep1" /> 現在描かれている画像をキャプチャするボタンです。</p>
<p><img
src="./images/172030687-d3b7111e-4fc6-4c18-b68c-14180fb7310f.png"
alt="top6" />
現在描かれている画像を最初にして、新しいファイルを作成します。 -
新しいファイルが作成されると、既存のイメージとリプレイデータが完全に消えるので、使用する前にデータを保存してください。</p>
<p><img
src="./images/181043728-64851b97-a830-4b4c-9919-1a7f167ff661.png"
alt="rep3-1" /> データの前/後の部分を消去するボタンです。 -
フレーム探索バーで望む時点に移動した後にこのボタンを2秒間押してください。
-
このボタンを使って残したい部分のデータを編集することができます。もちろん描画モードで描いている絵にも影響があるのでご注意ください。
-
データの以後の消しボタンはUndoと同じく作動します。使用すると、描画モードで描いている絵がリプレイが描かれている時点に戻ります。
- 消去されたデータは復元できませんので、ご注意してご使用ください。</p>
<p><img
src="./images/172031166-a63af1b2-1472-45fe-970d-e3eeb239180c.png"
alt="rep5" />
キャンバスを拡大/縮小するボタンです。マウス右クリックでズームをリセットできます。</p>
<p><img
src="./images/197422680-0d6a2568-fb22-4f8b-a784-24a7b76984f7.png"
alt="repfit" />
キャンバスをウィンドウの中央に配置します。クリックするたび昨日をON/OFFします。</p>
<p><img
src="./images/172031167-42eb5419-d4c4-4585-9e67-f2ec0d9128de.png"
alt="rep6" />
キャンバスを回転するボタンです。クリックした後ドゥジュエウにドラッグしてください。</p>
<p><img
src="./images/172031275-edcaa712-2755-40d6-b1fe-d06594a7ada0.png"
alt="rep7" /> リプレイをストローク単位に移動するボタンです。
このボタンを右クリックするか、<code>Shift</code>キーを押したままクリックすると、1フレーム単位で探索することができます。</p>
<p><img src="./images/71df26b1-f3be-48f7-8d9b-fa2cf6b68f1e.png"
alt="reprepeat" />
このボタンが有効になったら、リプレイが終了した時、１０秒後にまた再生します。</p>
<p><img
src="./images/172031160-b73481cd-691d-4c1a-b74c-52a72e317ea5.png"
alt="rep0" /> リプレイ再生速度を調節 -
再生時間が短い場合は活性化されません。</p>
<h2 id="キャプチャモード">キャプチャモード</h2>
<figure>
<img src="./images/c3b5ad3f-3422-49d0-af28-ca2f97d88f90.png" alt="image" />
<figcaption aria-hidden="true">image</figcaption>
</figure>
<ul>
<li>キャンバスをクリックすると画像を保存できます。</li>
<li>キャンバスにクリック+ドラッグして領域指定を行うことができます。</li>
<li>キャンバス領域内をクリック+ドラッグして領域を移動するか、領域の枠線にマウスを合わせると該当の辺がオレンジ色に変わるので、そのままクリック+ドラッグして辺ごとにサイズを変更できます。</li>
<li>選択範囲を解除するにはキャンバスを右クリックします。</li>
</ul>
<p><img
src="./images/172031636-159bcc58-899a-4615-b4f2-a90c0a95ffd2.png"
alt="cap1" /> キャプチャモードを終了するボタンです。</p>
<p><img
src="./images/172031637-c89edf44-6af9-4db8-8483-76dfa43a1ab9.png"
alt="cap2" /> 全体のイメージを保存するボタンです。 -
キャプチャモードでイメージにクリック+ドラッグで領域を指定して保存することもできます。</p>
<p><img
src="./images/192659795-1ddcd674-aa1d-4814-809d-8d75104d74bd.png"
alt="capclip" />
全体または選択された領域をクリップボードにコピーします。
クリックすると重複コピーを防止するためにボタンが無効になり、領域を新たに選択したり、画像が回転/反転などになった場合、再び活性化されます。</p>
<p><img
src="./images/172031638-48288a0b-c7d9-431f-817d-fbf3802b1794.png"
alt="cap3" /> イメージを回転するボタンです。</p>
<p><img
src="./images/172031639-2c49e674-516c-4149-98f4-c1d61235c15e.png"
alt="cap4" /> 画像を左右反転するボタンです。</p>
<p><img
src="./images/172031641-8f54a9b4-b811-4abb-bc5e-44b9dc314ff1.png"
alt="cap5" /> 背景色を透明にするボタンです。</p>
<p><img src="./images/693f7d7e-371a-47de-97f8-f193857fb3e5.png"
alt="capstamp1" /> 画像にスタンプを追加します。
コメントを2行まで作成でき、保存された日付とアプリのバージョンも一緒に表示されます。</p>
<h1 id="lassoの使い方">Lassoの使い方</h1>
<ul>
<li>Lassoツールを選択して(または<code>R</code>,<code>Y</code>キーを押したまま）好きな領域を描くとメニューが表示されます。</li>
<li>メニューが表示された状態でキャンバス部分をクリック+ドラッグすると領域内の画像が動きます。</li>
</ul>
<p><img
src="./images/193026133-b5f0cd8c-99da-4222-b698-afa908afbba1.png"
alt="lassotrace" />
選択した領域の画像を参考レイヤーに移動させます。参考レイヤーに画像が描かれている場合は、その上に描かれます。</p>
<p><img src="./images/eb9edd50-6f24-4349-adde-4f185ebde616.png"
alt="lassolayerswap" /> 選択した領域のレイヤー位置を交換します。
誤って2番レイヤーに線画を描いた場合、この機能を利用して画像の一部を1番レイヤーに移動させることができます。でもほかのレイヤーが見えないか、チェックされている場合は使用できません。</p>
<p><img src="./images/fdeeaee1-9d0f-4a36-b533-6b278e92650b.png"
alt="lassolayermerge" /> 選択した領域のレイヤーを 2
番のレイヤーにまとめます。</p>
<p><img
src="./images/174497388-def91772-41ce-4e92-86b1-81eca1077fe4.png"
alt="lasso3" /> 選択された領域を左右反転します。</p>
<p><img
src="./images/174497389-a055bff9-92ca-49d5-8d6d-83720849a452.png"
alt="lasso4" /> 選択された領域を1ピクセルずつ動きます。</p>
<p><img
src="./images/174497390-f101fb73-5c53-40d7-a7a3-83da82139763.png"
alt="lasso5" /> 選択された領域をコピーします。</p>
<p><img
src="./images/174497392-b4bdc991-5f08-43fc-b9e2-61a11d1cb5d3.png"
alt="lasso6" /> 選択された領域を回転したり拡大/縮小します。</p>
<h1 id="参考レイヤーの使い方">参考レイヤーの使い方</h1>
<ul>
<li>FOFOペイントは絵を描くことのできる本レイヤーが一つあって、参考レイヤーは、本レイヤー下側に位置します。</li>
<li>言葉そのまま参考にできるレイヤーにより、きれいに線を取ったりしときに使われたレイヤです。</li>
<li>ツールメニューで参考レイヤー(Reference
layer)を選択すると、ウィンドウが表示されます。</li>
</ul>
<p><img
src="./images/172031885-570f0c39-afdd-4893-a806-31cbfbc3d159.png"
alt="ref1" /> 現在の画像を参考にレイヤーに移動させるボタンです。 -
参考レイヤーに画像が描かれている場合は、その上に描き続けます。 -
Undoボタンを押すと、消えた画像を復元することができます。 -
本レイヤーに下絵を描き、このボタンを押して画像を参考レイヤーに送り、その絵を参考にしてきれいに絵を描くことができます。</p>
<p><img
src="./images/172031887-b4bcd7ca-7d65-40e1-95d1-ad2cb350d339.png"
alt="ref2" /> 参考レイヤーに別の画像を表示するボタンです。 -
参考にレイヤーにある画像が消され、読み込んだ画像が新しく描かれます。 -
トレーシングの練習をしようとする時、イメージをこのボタンを利用して画像を読み込みます。</p>
<p><img
src="./images/172031888-515b753c-9d8b-4d6a-b03c-16891d27dde9.png"
alt="ref3" />
クリップボードにコピーされた画像を参考レイヤーにコピーするボタンです。 -
クリップボードにコピーされた画像がある場合、このボタンが有効になります。</p>
<p><img
src="./images/172031890-968b6647-e8af-49ad-b6ed-6bb545eeb6ce.png"
alt="ref5" /> メモリートレーニングのボタンなのです。 -
このボタンを押して目が閉じたら絵を描く時ごとに参考レイヤーが見えないようになります。トレーシングの練習をする時の形を記憶する練習をすることができます。</p>
<p><img
src="./images/172031891-f2ff7470-a28e-4fea-8617-954a71a2e7af.png"
alt="ref6" /> 参考レイヤーの画像を消すボタンです。</p>
<p><img
src="./images/172032165-11d5e768-687e-4b4f-8e86-136e0c9e3c9a.png"
alt="ref7" /> 参考レイヤーの透明度を調節 -
参考レイヤーに新しいイメージがコピーされれば、透明度が50%へと下方修正されます。</p>
<h1 id="キャンバスサイズ調節">キャンバスサイズ調節</h1>
<ul>
<li><p><code>Ctrl</code>キーを押すか、マウスの右クリックを1秒ほど押すと、キャンバス周辺に枠が現れます。</p></li>
<li><p>そして、お好みの枠をクリック+ドラッグしてキャンバスをお好みの大きさに調整します。
対角線調整はできず、縦または横のみの調整が可能です。</p></li>
<li><p><code>Ctrl</code>キーを離したり、マウスの右クリックを離したりすると、キャンバスのサイズ調整が終了します。</p></li>
<li><p>キャンバスサイズを調整するとき、キャンバス周りの格子線にカーソルを当てると、一定比率に合わせて調整できます。
<img src="./images/198891449-27a86ac2-bc51-40e8-acdf-47e1ebe326cc.gif"
alt="snapresize" /></p></li>
</ul>
<h1
id="アプリのウィンドウサイズのスケーリングを設定">アプリのウィンドウサイズのスケーリングを設定</h1>
<p>・高解像度モニターでウィンドウサイズのスケールを125%以上に設定した場合に、FOFO
Paint UIのスケールを1:1にするかどうかを設定します。</p>
<ul>
<li><p>fofopaint.exe ファイルを見つけます。
デフォルトのインストールを行った場合は、C:Files
(x86)にあります。</p></li>
<li><p>fofopaint.exe を右クリックし、[プロパティ] に移動します。
「互換性」タブをクリックします。</p></li>
<li><p>[高 DPI 設定の変更]
をクリックします。新しいウィンドウの下部にある [DPI オーバーライド]
タブがアクティブな場合、FOFO PAINT アプリの UI は 1:1
のスケーリングを維持し、
チェックを外すとウィンドウサイズの倍率に合わせて少し拡大されます。</p></li>
<li><p>高 DPI
設定が変更されない場合は、「すべてのユーザーに対して変更」をクリックし、再度高
DPI 設定の変更をクリックして設定してください。</p></li>
</ul>
<h1 id="手動でアプリ初期化">手動でアプリ初期化</h1>
<ul>
<li><p>Windowsオペレーティングシステムの場合、&lt;
C:&lt;ユーザー名&gt;&gt;または&lt;
%appdata%&gt;パスに行くとファイルがあります。これらのファイルをすべて削除してアプリを起動すると、アプリが初期化されます。</p></li>
<li><p>あるいは、ファイル検索で”repdata”という名前を検索し、その位置に移動してファイルをすべて消してください。</p></li>
</ul>
<p>#デフォルトアプリの設定 - Windowsのユーザーベースの説明です。 -
ファイルを保存すると<em>.2020ファイルが生成されますが、このファイルをダブルクリックすると、どのアプリを接続するかを選択できます。
- pcでアプリ選択ボタンをクリックした後、fofo
paintインストールパス（C：¥Program
Files（x86）¥fofoPaint）に移動し、fofopaint.exeをクリックします。 -
基本アプリが正しく選択された場合</em>.2020拡張子ファイルのアイコンが縞柄のしっぽのポポちゃんに変更されます。
- *.2020ファイルをダブルクリックして実行すると、fofo
paintアプリが起動し、ドラッグ＆ドロップメニューが表示されます。 -
既存に保存されていた画像を保存せずにロードするには「load
file」をクリックし、保存してロードするには「save and load
file」を選択します。 - transfer to reference
layerは画像を参照レイヤーに転送するボタンです。</p>
</template>


<script>
(function(){
  var I18N = {
    kr:{html:"ko", title:"FofoPaint 매뉴얼"},
    eng:{html:"en", title:"FofoPaint Manual"},
    jp:{html:"ja", title:"FofoPaint マニュアル"}
  };
  var $ = function(s){return document.querySelector(s)};
  var content=$("#content"), toc=$("#toc");
  var lang="kr", observer=null;

  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  function detectLang(){
    var saved=load("fofo-manual-lang"); if(saved&&I18N[saved]) return saved;
    var n=(navigator.language||"ko").toLowerCase();
    return n.indexOf("ja")===0?"jp":n.indexOf("ko")===0?"kr":n.indexOf("en")===0?"eng":"kr";
  }

  function render(l, keepHash){
    lang=l;
    var t=document.getElementById("doc-"+l);
    content.innerHTML=""; content.appendChild(t.content.cloneNode(true));
    document.documentElement.lang=I18N[l].html;
    document.title=I18N[l].title;
    
    document.querySelectorAll("#langSeg button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.lang===l);
    });
    content.querySelectorAll("table").forEach(function(tb){
      var w=document.createElement("div"); w.className="table-wrap";
      tb.parentNode.insertBefore(w,tb); w.appendChild(tb);
    });
    // drop empty table rows' stray cells are fine; build toc
    buildToc();
    store("fofo-manual-lang",l);
    var h=decodeURIComponent(location.hash.slice(1));
    var target=keepHash&&h&&document.getElementById(h);
    if(target){target.scrollIntoView()} else {window.scrollTo(0,0)}
  }

  function buildToc(){
    toc.innerHTML="";
    var cur=null;
    content.querySelectorAll("h1,h2").forEach(function(h){
      var li=document.createElement("li"), a=document.createElement("a");
      a.href="#"+h.id; a.textContent=h.textContent.trim(); a.dataset.id=h.id;
      li.appendChild(a);
      if(h.tagName==="H1"){li.className="l1";toc.appendChild(li);cur=document.createElement("ul");cur.className="toc";li.appendChild(cur);}
      else{li.className="l2"; (cur||toc).appendChild(li);}
    });
    spy();
  }

  function spy(){
    if(observer) observer.disconnect();
    var heads=[].slice.call(content.querySelectorAll("h1,h2"));
    observer=new IntersectionObserver(function(){
      var top=null;
      heads.forEach(function(h){ if(h.getBoundingClientRect().top<=90) top=h; });
      if(!top) top=heads[0];
      toc.querySelectorAll("a.active").forEach(function(a){a.classList.remove("active")});
      var a=toc.querySelector('a[data-id="'+CSS.escape(top.id)+'"]');
      if(a){a.classList.add("active");
        var sb=$("#sidebar"), r=a.getBoundingClientRect(), sr=sb.getBoundingClientRect();
        if(r.top<sr.top+60||r.bottom>sr.bottom-20) sb.scrollTo({top:a.offsetTop-sb.clientHeight/3});
      }
    },{rootMargin:"0px 0px -60% 0px",threshold:[0,1]});
    heads.forEach(function(h){observer.observe(h)});
    window.addEventListener("scroll",onScroll,{passive:true});
  }
  var tick=false;
  function onScroll(){
    if(tick) return; tick=true;
    requestAnimationFrame(function(){tick=false; if(observer){observer.takeRecords();}
      var heads=content.querySelectorAll("h1,h2"), top=heads[0];
      heads.forEach(function(h){ if(h.getBoundingClientRect().top<=90) top=h; });
      toc.querySelectorAll("a.active").forEach(function(a){a.classList.remove("active")});
      var a=top&&toc.querySelector('a[data-id="'+CSS.escape(top.id)+'"]'); if(a) a.classList.add("active");
    });
  }

  function go(id){
    var el=document.getElementById(id); if(!el) return;
    el.scrollIntoView({behavior:"smooth"});
    history.replaceState(null,"","#"+encodeURIComponent(id));
    document.body.classList.remove("nav-open");
  }
  document.addEventListener("click",function(e){
    var a=e.target.closest("a[href^='#']");
    if(a){e.preventDefault(); go(decodeURIComponent(a.getAttribute("href").slice(1)));}
  });

  // language
  document.querySelectorAll("#langSeg button").forEach(function(b){
    b.addEventListener("click",function(){ render(b.dataset.lang,false); history.replaceState(null,"",location.pathname); });
  });

  // theme
  function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
  var th=load("fofo-manual-theme"); if(th) applyTheme(th);
  $("#themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    var nx=cur==="dark"?"light":"dark"; applyTheme(nx); store("fofo-manual-theme",nx);
  });

  // mobile nav
  $("#menuBtn").addEventListener("click",function(){document.body.classList.toggle("nav-open")});
  $("#scrim").addEventListener("click",function(){document.body.classList.remove("nav-open")});

  // lightbox
  var lb=$("#lb"), lbi=lb.querySelector("img");
  content.addEventListener("click",function(e){
    var img=e.target.closest("img"); if(!img||img.closest("table")) return;
    lbi.src=img.src; lb.classList.add("on");
  });
  lb.addEventListener("click",function(){lb.classList.remove("on")});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){lb.classList.remove("on");document.body.classList.remove("nav-open")}});

  render(detectLang(),true);
})();
</script>
</body>
</html>
